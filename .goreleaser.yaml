# Release builds: one static binary per OS and architecture.
# Test locally with: goreleaser release --snapshot --clean
version: 2
project_name: lagdoc

builds:
  - env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/ag3ntsc4rn/lagdoc/cmd.version={{.Version}}
      - -X github.com/ag3ntsc4rn/lagdoc/cmd.commit={{.ShortCommit}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  use: github-native
