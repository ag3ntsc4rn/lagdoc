name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # Run the real thing on each OS, so a collector that breaks on one
      # platform fails here rather than on someone's machine.
      - run: go run . --json
      - run: go run . --no-color
      # The runs above saved records, so this compares with a real one.
      - run: go run . changes --json
      - run: go run . changes --no-color --since 0

  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --snapshot --clean

  # The single check main's ruleset requires.
  ci:
    if: always()
    needs: [test, release-config]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = success && test "${{ needs.release-config.result }}" = success
